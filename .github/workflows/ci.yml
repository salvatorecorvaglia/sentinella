name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Lint & Format
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-suffix: "lint"
          python-version: "3.12"

      - name: Sync workspace
        run: uv sync --all-extras --dev --frozen

      - name: Run Ruff check
        run: uv run --frozen ruff check

      - name: Run Ruff format check
        run: uv run --frozen ruff format --check

      - name: Run mypy
        run: uv run --frozen mypy

  audit:
    name: Dependency audit
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-suffix: "audit"
          python-version: "3.12"

      - name: Sync workspace
        run: uv sync --all-extras --dev --frozen

      - name: Audit dependencies for known vulnerabilities
        run: uv export --frozen --format requirements-txt --no-emit-project --all-extras --dev | uv run --frozen --with pip-audit pip-audit --strict -r /dev/stdin

  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-15
            python-version: "3.13"
          - os: windows-2022
            python-version: "3.13"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-suffix: "${{ matrix.os }}-${{ matrix.python-version }}"
          python-version: ${{ matrix.python-version }}

      - name: Sync workspace
        run: uv sync --all-extras --dev --frozen

      - name: Run test suite with coverage
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        run: uv run --frozen pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Run test suite (other platforms and Python versions)
        if: matrix.os != 'ubuntu-24.04' || matrix.python-version != '3.12'
        run: uv run --frozen pytest

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  web-test:
    name: Web dashboard tests
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check JavaScript with Biome
        run: pnpm lint

      - name: Run vitest with coverage
        run: pnpm test:coverage

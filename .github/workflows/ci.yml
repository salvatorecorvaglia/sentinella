name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Lint & Format
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-suffix: "lint"
          python-version: "3.12"

      - name: Sync workspace
        run: uv sync --all-extras --dev --frozen

      - name: Run Ruff check
        run: uv run --frozen ruff check

      - name: Run Ruff format check
        run: uv run --frozen ruff format --check

      - name: Run mypy
        run: uv run --frozen mypy

      - name: Audit dependencies for known vulnerabilities
        run: uv export --frozen --format requirements-txt --no-emit-project --all-extras --dev | uv run --frozen --with pip-audit pip-audit --strict -r /dev/stdin

  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.12"
            versions: "3.11 3.12 3.13"
          - os: macos-15
            python-version: "3.13"
            versions: "3.13"
          - os: windows-2022
            python-version: "3.13"
            versions: "3.13"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-suffix: "${{ matrix.os }}-${{ matrix.python-version }}"
          python-version: ${{ matrix.python-version }}

      - name: Test every supported Python version
        shell: bash
        env:
          PYTHON_VERSIONS: ${{ matrix.versions }}
        run: |
          set -euo pipefail
          failed=0
          for version in $PYTHON_VERSIONS; do
            export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/sentinella-python-$version"
            if ! uv sync --all-extras --dev --frozen --python "$version"; then
              failed=1
              continue
            fi
            if [[ "$RUNNER_OS" == Linux && "$version" == 3.12 ]]; then
              uv run --frozen --python "$version" pytest --cov --cov-report=term-missing --cov-report=xml --durations=15 || failed=1
            else
              uv run --frozen --python "$version" pytest --durations=15 || failed=1
            fi
          done
          exit "$failed"

      - name: Upload coverage artifact
        if: ${{ always() && matrix.os == 'ubuntu-24.04' && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  web-test:
    name: Web dashboard tests
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check JavaScript with Biome
        run: pnpm lint

      - name: Run vitest with coverage
        run: pnpm test:coverage

  package:
    name: Build and validate Python distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Build sdist and wheel from sdist
        run: uv build --out-dir dist
      - name: Validate distribution metadata
        run: uvx --from twine twine check --strict dist/*.whl dist/*.tar.gz
      - name: Install wheel and sdist independently
        shell: bash
        run: |
          set -euo pipefail
          for package in "$GITHUB_WORKSPACE"/dist/*.whl "$GITHUB_WORKSPACE"/dist/*.tar.gz; do
            smoke_dir=$(mktemp -d)
            uv venv "$smoke_dir/venv" --python 3.13
            uv pip install --python "$smoke_dir/venv/bin/python" "$package"
          done
      - name: Generate checksums
        run: (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: dist-packages
          path: dist/
          if-no-files-found: error
          retention-days: 7

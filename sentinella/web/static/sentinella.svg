<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sentinella-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="sentinella-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="wing-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="sentinella-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="108" fill="url(#sentinella-bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="url(#sentinella-accent)" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Telemetry Grid Overlay -->
  <g opacity="0.15" stroke="#38BDF8" stroke-width="1">
    <line x1="96" y1="128" x2="416" y2="128"/>
    <line x1="96" y1="192" x2="416" y2="192"/>
    <line x1="96" y1="256" x2="416" y2="256"/>
    <line x1="96" y1="320" x2="416" y2="320"/>
    <line x1="96" y1="384" x2="416" y2="384"/>
    <line x1="128" y1="96" x2="128" y2="416"/>
    <line x1="192" y1="96" x2="192" y2="416"/>
    <line x1="256" y1="96" x2="256" y2="416"/>
    <line x1="320" y1="96" x2="320" y2="416"/>
    <line x1="384" y1="96" x2="384" y2="416"/>
  </g>

  <!-- Sentinella Silhouette & Telemetry Wave -->
  <g transform="translate(0, 0)">
    <!-- Stylized Sentinella Head & Beak -->
    <path d="M 330 150 C 370 165, 410 195, 430 205 L 360 225 C 330 240, 290 250, 250 250 Z" fill="url(#wing-grad)" filter="url(#sentinella-glow)"/>
    
    <!-- Sentinella Eye / Pulse Point -->
    <circle cx="340" cy="190" r="12" fill="#06B6D4" filter="url(#sentinella-glow)"/>
    <circle cx="340" cy="190" r="5" fill="#FFFFFF"/>

    <!-- Wing Feathers / Metric Bars -->
    <path d="M 120 330 C 160 260, 220 200, 310 170 C 270 210, 240 270, 210 350 Z" fill="url(#sentinella-accent)" opacity="0.9" filter="url(#sentinella-glow)"/>
    <path d="M 90 370 C 130 310, 180 260, 260 220 C 220 270, 190 330, 160 400 Z" fill="#818CF8" opacity="0.6"/>

    <!-- Dynamic Telemetry Oscilloscope Wave -->
    <path d="M 80 340 L 140 340 L 170 270 L 200 390 L 230 310 L 260 350 L 300 240 L 330 300 L 370 280 L 430 280" fill="none" stroke="#06B6D4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#sentinella-glow)"/>
  </g>
</svg>

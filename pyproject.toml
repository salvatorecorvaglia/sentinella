[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinella-monitor"
version = "1.0.0"
description = "Cross-platform system monitor with TUI, web dashboard, and remote monitoring"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Salvatore Corvaglia"},
]

dependencies = [
    "psutil>=5.9.0",
    "textual>=0.80.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
docker = ["docker>=7.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
]
all = ["sentinella-monitor[docker,dev]"]

[project.scripts]
sentinella = "sentinella.cli:main"

[project.urls]
Homepage = "https://github.com/salvatorecorvaglia/sentinella"
Documentation = "https://github.com/salvatorecorvaglia/sentinella#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinella*"]

[tool.setuptools.package-data]
"sentinella" = ["py.typed"]
"sentinella.tui" = ["*.tcss"]
# Recursive: static/vendor/ holds the bundled Chart.js, and a non-recursive
# "static/*" would silently drop it from the wheel.
"sentinella.web" = ["static/**/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead.",
    "ignore:.*starlette.testclient.*:DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
files = ["sentinella"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["sentinella"]

[tool.coverage.report]
# Floor, not a target — raise it as coverage improves, never lower it.
fail_under = 80
show_missing = true

[dependency-groups]
dev = [
    "ruff==0.16.7",
]
